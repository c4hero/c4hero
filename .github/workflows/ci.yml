name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      # dependency-review requires GitHub Advanced Security on private repos.
      # Until GHAS is enabled, let the action run but don't fail CI on the
      # "Dependency review is not supported on this repository" error.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Validates serializer output against the real Structurizr parser. Every
  # other DSL test checks c4hero against itself, which is why GH #109 (invalid
  # emitted DSL) passed CI for months.
  dsl-conformance:
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately: the encoding rules the serializer targets were
      # verified against this release (structurizr-java 5.0.2). A parser change
      # should be an explicit bump, not a silent break on a Monday morning.
      # Single source of truth for both the cache key and the download URL.
      STRUCTURIZR_VERSION: 2025.11.09
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Cached by version so a GitHub-releases hiccup can't fail the build.
      - name: Cache Structurizr CLI
        id: structurizr-cache
        uses: actions/cache@v5
        with:
          path: .structurizr-cli
          key: structurizr-cli-${{ env.STRUCTURIZR_VERSION }}
      - name: Install Structurizr CLI
        if: steps.structurizr-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/structurizr-cli.zip \
            "https://github.com/structurizr/cli/releases/download/v${STRUCTURIZR_VERSION}/structurizr-cli.zip"
          unzip -q /tmp/structurizr-cli.zip -d .structurizr-cli
          chmod +x .structurizr-cli/structurizr.sh
      - name: Report Structurizr CLI version
        run: ./.structurizr-cli/structurizr.sh version
      - name: Verify emitted DSL against the real Structurizr parser
        env:
          STRUCTURIZR_CONFORMANCE: '1'
        run: npm run test:conformance

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks-action wrapper requires a paid license for GitHub
      # organizations. We invoke the gitleaks CLI directly instead — same
      # scan, no license requirement for org-owned repos.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --no-banner
